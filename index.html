<html lang="en">
<head>

  <link rel="apple-touch-icon" href="icons/icon-192.jpg">
  <link rel="manifest" href="manifest.json">

  <title>Okinawa Travel Guide</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      transition: background-color 0.2s, color 0.2s, border-color 0.2s;
    }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
      min-height: 100vh;
    }
    body.dark {
      --bg: #0a0f1a;
      --surface: #1e293b;
      --surface-light: #2d3a4e;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --border: #334155;
      --card-bg: #1e293b;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --sponsor-bg: #111827;
    }
    body.light {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-light: #f1f5f9;
      --text: #0f172a;
      --text-muted: #475569;
      --border: #cbd5e1;
      --card-bg: #ffffff;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --sponsor-bg: #f1f5f9;
    }
    body {
      background: var(--bg);
      color: var(--text);
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px;
    }
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .logo h1 {
      font-size: 1.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, #3b82f6, #06b6d4);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    button, .lang-btn {
      background: var(--surface-light);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 30px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      color: var(--text);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    button.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
      margin: 24px 0;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.1s ease;
    }
    .card:hover {
      transform: translateY(-4px);
    }
    .card-img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      background: #2d3a4e;
    }
    .card-content {
      padding: 16px;
    }
    .card-title {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .back-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }
    .back-btn {
      background: var(--surface-light);
      border: none;
      padding: 8px 16px;
      border-radius: 40px;
      cursor: pointer;
      font-weight: 500;
    }
    .item-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .item-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 16px;
      cursor: pointer;
    }
    .item-card h3 {
      margin-bottom: 8px;
    }
    .detail-card {
      background: var(--card-bg);
      border-radius: 28px;
      padding: 20px;
      margin: 16px 0;
    }
    .detail-img {
      width: 100%;
      max-height: 300px;
      object-fit: cover;
      border-radius: 20px;
      margin: 16px 0;
    }
    .official-link {
      display: inline-block;
      margin-top: 16px;
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
    }
    .sponsor {
      background: var(--sponsor-bg);
      border-radius: 20px;
      padding: 16px;
      text-align: center;
      margin: 24px 0;
      border: 1px dashed var(--border);
    }
    .sponsor img {
      max-width: 100%;
      height: auto;
      border-radius: 12px;
      margin-bottom: 10px;
    }
    .map-container {
      margin: 32px 0;
      border-radius: 24px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    iframe {
      width: 100%;
      height: 300px;
      border: 0;
    }
    footer {
      margin-top: 48px;
      padding: 28px 16px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      text-align: center;
      font-size: 0.9rem;
    }
    footer a {
      color: var(--primary);
      text-decoration: none;
    }
    .section-title {
      font-size: 1.8rem;
      margin: 32px 0 16px;
    }
    .sub-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
    }
  </style>
</head>

          { name: "Toka Beach", name_jp: "東風浜", desc: "Small cove with rocky formations, good for exploring tide pools.", location: "Akajima", url: "#" },
          { name: "Nakanoshima Beach", name_jp: "中ノ島ビーチ", desc: "A hidden gem only reachable by foot at low tide.", location: "Akajima", url: "#" }
        ]
      },
      zamami: {
        spots: [
          { name: "Furuzamami Beach Viewpoint", name_jp: "古座間味ビーチ展望台", desc: "Iconic viewpoint overlooking the emerald bay of Furuzamami.", location: "Zamami", url: "#" },
          { name: "Zamami Port Village", name_jp: "座間味港集落", desc: "A charming village with traditional Ryukyu houses and small shops.", location: "Zamami", url: "#" },
          { name: "Takatsukiyama Observation Deck", name_jp: "高月山展望台", desc: "Panoramic view of the entire Zamami island chain and coral reefs.", location: "Zamami", url: "#" },
          { name: "Sea Turtle Museum", name_jp: "ウミガメ博物館", desc: "Small museum dedicated to the conservation of sea turtles in Kerama.", location: "Zamami", url: "#" },
          { name: "Ama Rock", name_jp: "阿真岩", desc: "A large rock formation off the coast, said to be a sacred place for fishermen.", location: "Zamami", url: "#" }
        ],
        beaches: [
          { name: "Furuzamami Beach", name_jp: "古座間味ビーチ", desc: "The most famous beach in Zamami, with powdery white sand and abundant tropical fish.", location: "Zamami", url: "#" },
          { name: "Ama Beach", name_jp: "阿真ビーチ", desc: "A shallow, calm beach where sea turtles often come to feed.", location: "Zamami", url: "#" },
          { name: "Kitahama Beach", name_jp: "北浜", desc: "A quieter alternative to Furuzamami, with soft sand and good snorkeling.", location: "Zamami", url: "#" },
          { name: "Gahi Beach", name_jp: "雅日浜", desc: "A remote beach accessible by a short hike, offering solitude and natural beauty.", location: "Zamami", url: "#" },
          { name: "Yokobushi Beach", name_jp: "ヨコブシビーチ", desc: "A tiny cove with crystal clear water, great for snorkeling off the rocks.", location: "Zamami", url: "#" }
        ]
      }
    };

    // 石垣・宮古：サブエリア（石垣島、宮古島）
    const ishimiyaSubAreas = {
      ishigaki: { name: "Ishigaki Island", name_jp: "石垣島", img: "https://placehold.co/600x400/2d6a4f/white?text=Ishigaki" },
      miyako: { name: "Miyako Island", name_jp: "宮古島", img: "https://placehold.co/600x400/0b5e42/white?text=Miyako" }
    };

    const ishimiyaDetailedData = {
      ishigaki: {
        spots: [
          { name: "Kabira Bay", name_jp: "川平湾", desc: "A breathtaking emerald bay dotted with small islands; glass-bottom boat tours available.", location: "Ishigaki", url: "https://visit-ishigaki.jp/en/spot/kabira-bay/" },
          { name: "Mt. Omoto", name_jp: "於茂登岳", desc: "The highest peak in Okinawa Prefecture, offering jungle trekking and panoramic views.", location: "Ishigaki", url: "#" },
          { name: "Yonehara Beach Coral Reef", name_jp: "米原ビーチのサンゴ", desc: "Home to one of the largest areas of blue coral in Japan, accessible by snorkeling.", location: "Ishigaki", url: "#" },
          { name: "Ishigaki Stalactite Cave", name_jp: "石垣島鍾乳洞", desc: "A 3.2km-long limestone cave with impressive stalactite formations.", location: "Ishigaki", url: "#" },
          { name: "Tamatorizaki Observatory", name_jp: "玉取崎展望台", desc: "A scenic overlook with views of the Pacific Ocean and the rugged coastline.", location: "Ishigaki", url: "#" }
        ],
        beaches: [
          { name: "Yonehara Beach", name_jp: "米原ビーチ", desc: "A popular snorkeling spot with easy access from the road and shallow coral gardens.", location: "Ishigaki", url: "#" },
          { name: "Sukuji Beach", name_jp: "底地ビーチ", desc: "A calm, shallow beach ideal for families, with a view of Kabira Bay's entrance.", location: "Ishigaki", url: "#" },
          { name: "Fusaki Beach", name_jp: "フサキビーチ", desc: "A resort beach inside Fusaki Resort Village, with water sports and facilities.", location: "Ishigaki", url: "#" },
          { name: "Hirakubo Beach", name_jp: "平久保ビーチ", desc: "A remote, wild beach at the northern tip, known for its dramatic scenery.", location: "Ishigaki", url: "#" },
          { name: "Tōjinbaka", name_jp: "唐人墓", desc: "Not a beach but a historical monument; nearby cove offers quiet sand.", location: "Ishigaki", url: "#" }
        ]
      },
      miyako: {
        spots: [
          { name: "Yonaha Maehama Beach", name_jp: "与那覇前浜ビーチ", desc: "A 7km stretch of pristine white sand, often called 'the most beautiful beach in the Far East'.", location: "Miyakojima", url: "#" },
          { name: "Higashi Hennazaki Lighthouse", name_jp: "東平安名崎灯台", desc: "A scenic cape with a lighthouse, offering 360-degree ocean views.", location: "Miyakojima", url: "#" },
          { name: "Irabu Bridge", name_jp: "伊良部大橋", desc: "A 3.5km-long bridge connecting Miyakojima to Irabujima, with stunning blue water below.", location: "Miyakojima", url: "#" },
          { name: "Sunayama Beach Arch", name_jp: "砂山ビーチのアーチ", desc: "A natural stone arch eroded by waves, accessible from the beach.", location: "Miyakojima", url: "#" },
          { name: "Miyakojima City Tropical Plant Garden", name_jp: "宮古島市熱帯植物園", desc: "A lush garden with exotic plants, butterflies, and walking trails.", location: "Miyakojima", url: "#" }
        ],
        beaches: [
          { name: "Sunayama Beach", name_jp: "砂山ビーチ", desc: "A beautiful cove with fine white sand and a unique rock arch, accessed via a short sand dune walk.", location: "Miyakojima", url: "#" },
          { name: "Yoshino Beach", name_jp: "吉野海岸", desc: "A popular snorkeling beach with well-developed facilities and coral reefs.", location: "Miyakojima", url: "#" },
          { name: "Shigira Beach", name_jp: "シギラビーチ", desc: "A resort beach part of Shigira Bay Country Club, with calm waters and luxury amenities.", location: "Miyakojima", url: "#" },
          { name: "Nakanoshima Beach (Miyako)", name_jp: "中ノ島ビーチ", desc: "A quiet beach on a small island connected by a bridge, good for relaxation.", location: "Miyakojima", url: "#" },
          { name: "Tōriike Ponds", name_jp: "通り池", desc: "Two connected marine ponds with deep blue water, popular for diving.", location: "Miyakojima", url: "#" }
        ]
      }
    };

    // 多言語テキスト
    const translations = {
      en: { title:"Okinawa Travel Guide", back:"← Back", backHome:"🏠 Home", spots:"Sightseeing Spots", beaches:"Beaches", location:"Location", official:"Official Website", sponsor:"Sponsored", contact:"Contact us", yanbaru:"Yanbaru", motobu:"Motobu Peninsula", onnna:"Onna & Yomitan (North Resort)", central:"Central Area (Okinawa City, Uruma, Kadena, American Village)", naha:"Naha & Surroundings", southern:"Southern Area (Itoman, Yaese, Nanjo)", kerama:"Kerama Islands", ishigaki_miyako:"Ishigaki & Miyako Islands", sub_areas:"Choose an Island" },
      it: { title:"Guida di Okinawa", back:"← Indietro", backHome:"🏠 Home", spots:"Attrazioni", beaches:"Spiagge", location:"Posizione", official:"Sito ufficiale", sponsor:"Sponsorizzato", contact:"Contattaci", yanbaru:"Yanbaru", motobu:"Penisola di Motobu", onnna:"Onna & Yomitan (Resort nord)", central:"Area centrale", naha:"Naha e dintorni", southern:"Area meridionale", kerama:"Isole Kerama", ishigaki_miyako:"Isole Ishigaki e Miyako", sub_areas:"Scegli un'isola" },
      ru: { title:"Путеводитель по Окинаве", back:"← Назад", backHome:"🏠 Главная", spots:"Достопримечательности", beaches:"Пляжи", location:"Местоположение", official:"Официальный сайт", sponsor:"Спонсор", contact:"Свяжитесь с нами", yanbaru:"Ямбару", motobu:"Полуостров Мотобу", onnna:"Онна & Йомитан", central:"Центральный район", naha:"Наха и окрестности", southern:"Южный район", kerama:"Острова Керама", ishigaki_miyako:"Исигаки и Мияко", sub_areas:"Выберите остров" },
      ja: { title:"沖縄トラベルガイド", back:"← 戻る", backHome:"🏠 ホーム", spots:"観光名所", beaches:"ビーチ", location:"所在地", official:"公式サイト", sponsor:"スポンサー", contact:"お問い合わせ", yanbaru:"やんばる", motobu:"本部半島", onnna:"恩納村・読谷村", central:"中部 (沖縄市・うるま市・嘉手納・アメリカンビレッジ)", naha:"那覇とその周辺", southern:"南部 (糸満・八重瀬・南城)", kerama:"慶良間諸島", ishigaki_miyako:"石垣島・宮古島", sub_areas:"島を選ぶ" }
    };

    // 状態管理
    let currentPage = "home";           // home, area, subarea, item
    let selectedAreaId = null;
    let selectedSubAreaId = null;       // for kerama or ishigaki_miyako
    let selectedItem = null;            // { areaId, subAreaId, type, index }
    
    // ヘルパー関数
    function t(key) { return translations[currentLang][key] || key; }
    function localName(obj) {
      if (currentLang === "ja") return obj.name_jp || obj.name;
      return obj.name;
    }

    // 描画関数
    function render() {
      const main = document.getElementById("main-content");
      if (currentPage === "home") renderHome(main);
      else if (currentPage === "area") renderArea(main);
      else if (currentPage === "subarea") renderSubArea(main);
      else if (currentPage === "item") renderItem(main);
      updateTitle();
    }

    function renderHome(container) {
      let html = `<div class="sponsor"><img src="https://placehold.co/800x150/222/white?text=Your+Ad+Here" alt="sponsor"><p><a href="#">${t("sponsor")} Link →</a></p></div>`;
      html += `<div class="grid">`;
      for (let area of areas) {
        let name = t(area.nameKey) || area.id;
        html += `<div class="card" data-area="${area.id}">
          <img class="card-img" src="${area.img}" alt="${name}">
          <div class="card-content"><div class="card-title">${name}</div></div>
        </div>`;
      }
      html += `</div><div class="sponsor"><img src="https://placehold.co/800x150/222/white?text=Sponsored+by+Okinawa+Tourism" alt="sponsor"><p><a href="#">${t("sponsor")} Official</a></p></div>`;
      html += `<div class="map-container"><iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!d573234.9839075002!2d127.50022878921028!3d26.47304855040876!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x34e4e0a2d3e8e5b1%3A0x8f8b6d5c4a3e2f0!2sOkinawa%2C%20Japan!5e0!3m2!1sen!2sus!4v1712123456789!5m2!1sen!2sus" allowfullscreen loading="lazy"></iframe></div>`;
      container.innerHTML = html;
      document.querySelectorAll(".card").forEach(card => {
        card.addEventListener("click", () => {
          selectedAreaId = card.dataset.area;
          // エリアが kerama または ishigaki_miyako の場合はサブエリア選択ページへ
          if (selectedAreaId === "kerama" || selectedAreaId === "ishigaki_miyako") {
            currentPage = "subarea";
          } else {
            currentPage = "area";
            selectedSubAreaId = null;
          }
          render();
        });
      });
    }

    function renderArea(container) {
      // 通常エリア (データは normalAreaData から)
      const data = normalAreaData[selectedAreaId];
      if (!data) { currentPage = "home"; render(); return; }
      let areaName = t(selectedAreaId) || selectedAreaId;
      let html = `<div class="back-bar"><button class="back-btn" data-action="home">${t("backHome")}</button><button class="back-btn" data-action="back">${t("back")}</button></div>`;
      html += `<h2>${areaName}</h2><h3>${t("spots")}</h3><div class="item-list">`;
      data.spots.forEach((spot, idx) => {
        html += `<div class="item-card" data-type="spot" data-index="${idx}"><h3>${localName(spot)}</h3><p>${spot.desc.substring(0, 80)}...</p></div>`;
      });
      html += `</div><h3>${t("beaches")}</h3><div class="item-list">`;
      data.beaches.forEach((beach, idx) => {
        html += `<div class="item-card" data-type="beach" data-index="${idx}"><h3>${localName(beach)}</h3><p>${beach.desc.substring(0, 80)}...</p></div>`;
      });
      html += `</div>`;
      container.innerHTML = html;
      attachBackButtons();
      document.querySelectorAll(".item-card").forEach(card => {
        card.addEventListener("click", (e) => {
          selectedItem = { areaId: selectedAreaId, subAreaId: null, type: card.dataset.type, index: parseInt(card.dataset.index) };
          currentPage = "item";
          render();
        });
      });
    }

    function renderSubArea(container) {
      // 慶良間または石垣・宮古のサブエリア一覧
      let subAreas, detailedData;
      if (selectedAreaId === "kerama") {
        subAreas = keramaSubAreas;
        detailedData = keramaDetailedData;
      } else {
        subAreas = ishimiyaSubAreas;
        detailedData = ishimiyaDetailedData;
      }
      let areaName = t(selectedAreaId);
      let html = `<div class="back-bar"><button class="back-btn" data-action="home">${t("backHome")}</button><button class="back-btn" data-action="back">${t("back")}</button></div>`;
      html += `<h2>${areaName}</h2><p>${t("sub_areas")}</p><div class="grid">`;
      for (let [key, sub] of Object.entries(subAreas)) {
        let subName = currentLang === "ja" ? sub.name_jp : sub.name;
        html += `<div class="card" data-sub="${key}">
          <img class="card-img" src="${sub.img}" alt="${subName}">
          <div class="card-content"><div class="card-title">${subName}</div></div>
        </div>`;
      }
      html += `</div>`;
      container.innerHTML = html;
      attachBackButtons();
      document.querySelectorAll(".card").forEach(card => {
        card.addEventListener("click", () => {
          selectedSubAreaId = card.dataset.sub;
          currentPage = "area";  // サブエリア選択後、その島のデータを表示
          render();
        });
      });
    }

    // 上記renderAreaを拡張し、サブエリアデータも扱えるようにする
    // 現在のrenderAreaは通常エリアのみ。サブエリアがある場合はデータソースを切り替える
    // 修正：renderAreaでselectedSubAreaIdがある場合は detailedData から取得
    function renderArea(container) {
      let data;
      let areaName;
      if (selectedSubAreaId) {
        // 慶良間または石垣・宮古のサブエリア詳細
        if (selectedAreaId === "kerama") {
          data = keramaDetailedData[selectedSubAreaId];
          areaName = currentLang === "ja" ? keramaSubAreas[selectedSubAreaId].name_jp : keramaSubAreas[selectedSubAreaId].name;
        } else {
          data = ishimiyaDetailedData[selectedSubAreaId];
          areaName = currentLang === "ja" ? ishimiyaSubAreas[selectedSubAreaId].name_jp : ishimiyaSubAreas[selectedSubAreaId].name;
        }
        if (!data) { currentPage = "home"; render(); return; }
      } else {
        data = normalAreaData[selectedAreaId];
        if (!data) { currentPage = "home"; render(); return; }
        areaName = t(selectedAreaId) || selectedAreaId;
      }
      let html = `<div class="back-bar"><button class="back-btn" data-action="home">${t("backHome")}</button><button class="back-btn" data-action="back">${t("back")}</button></div>`;
      html += `<h2>${areaName}</h2><h3>${t("spots")}</h3><div class="item-list">`;
      data.spots.forEach((spot, idx) => {
        html += `<div class="item-card" data-type="spot" data-index="${idx}"><h3>${localName(spot)}</h3><p>${spot.desc.substring(0, 100)}...</p></div>`;
      });
      html += `</div><h3>${t("beaches")}</h3><div class="item-list">`;
      data.beaches.forEach((beach, idx) => {
        html += `<div class="item-card" data-type="beach" data-index="${idx}"><h3>${localName(beach)}</h3><p>${beach.desc.substring(0, 100)}...</p></div>`;
      });
      html += `</div>`;
      container.innerHTML = html;
      attachBackButtons();
      document.querySelectorAll(".item-card").forEach(card => {
        card.addEventListener("click", () => {
          selectedItem = { areaId: selectedAreaId, subAreaId: selectedSubAreaId, type: card.dataset.type, index: parseInt(card.dataset.index) };
          currentPage = "item";
          render();
        });
      });
    }

    function renderItem(container) {
      let itemData;
      if (selectedItem.subAreaId) {
        // サブエリア内のアイテム
        let parentData;
        if (selectedItem.areaId === "kerama") parentData = keramaDetailedData[selectedItem.subAreaId];
        else parentData = ishimiyaDetailedData[selectedItem.subAreaId];
        if (!parentData) { currentPage = "home"; render(); return; }
        const list = selectedItem.type === "spot" ? parentData.spots : parentData.beaches;
        itemData = list[selectedItem.index];
      } else {
        const parentData = normalAreaData[selectedItem.areaId];
        if (!parentData) { currentPage = "home"; render(); return; }
        const list = selectedItem.type === "spot" ? parentData.spots : parentData.beaches;
        itemData = list[selectedItem.index];
      }
      if (!itemData) { currentPage = "home"; render(); return; }

      let html = `<div class="back-bar"><button class="back-btn" data-action="home">${t("backHome")}</button><button class="back-btn" data-action="area">← ${t("back")}</button></div>`;
      html += `<div class="detail-card"><h2>${localName(itemData)}</h2><img class="detail-img" src="https://placehold.co/800x400/1f2a3e/white?text=${encodeURIComponent(localName(itemData))}" alt="${localName(itemData)}">`;
      html += `<p><strong>${t("location")}:</strong> ${itemData.location || "Okinawa"}</p><p>${itemData.desc}</p>`;
      if (itemData.url && itemData.url !== "#") html += `<a class="official-link" href="${itemData.url}" target="_blank">${t("official")} ↗</a>`;
      else html += `<a class="official-link" href="#">${t("official")} (example link)</a>`;
      html += `</div>`;
      container.innerHTML = html;
      attachBackButtons();
    }

    function attachBackButtons() {
      document.querySelectorAll(".back-btn").forEach(btn => {
        btn.addEventListener("click", (e) => {
          if (btn.dataset.action === "home") {
            currentPage = "home";
            selectedAreaId = null;
            selectedSubAreaId = null;
            selectedItem = null;
            render();
          } else if (btn.dataset.action === "back") {
            // 戻る処理
            if (currentPage === "item") {
              currentPage = "area";
              render();
            } else if (currentPage === "area") {
              if (selectedSubAreaId) {
                currentPage = "subarea";
                selectedSubAreaId = null;
                render();
              } else {
                currentPage = "home";
                selectedAreaId = null;
                render();
              }
            } else if (currentPage === "subarea") {
              currentPage = "home";
              selectedAreaId = null;
              render();
            }
          } else if (btn.dataset.action === "area") {
            currentPage = "area";
            render();
          }
        });
      });
    }

    function updateTitle() { document.getElementById("app-title").innerText = translations[currentLang].title; }
    function setLang(lang) { currentLang = lang; render(); }
    function setTheme(theme) { document.body.className = theme; currentTheme = theme; localStorage.setItem("theme", theme); }

    function initUI() {
      const langContainer = document.getElementById("lang-buttons");
      for (let [code, label] of Object.entries(languages)) {
        let btn = document.createElement("button");
        btn.innerHTML = label;
        btn.classList.add("lang-btn");
        if (code === currentLang) btn.classList.add("active");
        btn.onclick = () => { setLang(code); document.querySelectorAll(".lang-btn").forEach(b=>b.classList.remove("active")); btn.classList.add("active"); };
        langContainer.appendChild(btn);
      }
      document.getElementById("themeToggle").onclick = () => {
        const newTheme = currentTheme === "dark" ? "light" : "dark";
        setTheme(newTheme);
      };
      const savedTheme = localStorage.getItem("theme") || "dark";
      setTheme(savedTheme);
      render();
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').then(reg => console.log('SW registered', reg)).catch(err => console.log('SW failed', err));
    }
    initUI();
  </script>
</body>
</html>
